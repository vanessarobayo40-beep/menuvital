<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sin conexión — MenúVital</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 32px 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #F7FAF9; color: #1f2937;
  }
  @media (prefers-color-scheme: dark) { body { background: #161D19; color: #EDF2EE; } }
  .icon { font-size: 48px; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; color: #6b7280; max-width: 320px; line-height: 1.5; margin: 0 0 20px; }
  @media (prefers-color-scheme: dark) { p { color: #8A9A94; } }
  button {
    background: #0E6B45; color: #fff; border: none; border-radius: 12px;
    padding: 12px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>Sin conexión</h1>
  <p>No pudimos cargar esta página porque no tienes internet en este momento. Tu menú y progreso guardados siguen disponibles cuando vuelvas a la app.</p>
  <button onclick="location.reload()">Reintentar</button>
</body>
</html>
